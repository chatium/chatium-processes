version: 1
tables:
  - id: requests
    source: studio/tables/requests.table.ts
    purpose: Сохранить синтетическую заявку, исход решения и состояние публикации событий
    owner: ответственный сотрудник
    readers: [Staff+ с доступом к заявкам, сервер формы, сервис отчёта]
    identity:
      key: requestId
      rule: Одинаковый requestKey возвращает существующий requestId без второй записи и уведомления
    fields:
      - {name: requestId, type: string, purpose: Устойчивый ID заявки}
      - {name: legacyId, type: string | null, purpose: Связь со старой заявкой при переносе}
      - {name: classId, type: string, purpose: ID занятия из разрешённого каталога}
      - {name: testRecipientKey, type: string, purpose: Ключ синтетического контакта для обоих событий CRM}
      - {name: requestKey, type: string, purpose: Защита от повторной формы}
      - {name: status, type: pending | confirmed | declined, purpose: Ручное решение сотрудника}
      - {name: requestEventState, type: pending | accepted | failed | unknown | not-applicable, purpose: Результат события заявки; legacy запись не переиздаёт старое событие}
      - {name: bookingEventState, type: pending | accepted | failed | unknown | not-applicable, purpose: Результат события подтверждения}
      - {name: noticePending, type: boolean, purpose: Новая или мигрированная pending заявка требует просмотра сотрудником}
      - {name: noticeState, type: not-sent | queued | skipped | error | manual-backlog | acknowledged | not-applicable, purpose: Различить Store и ручную очередь старых заявок}
      - {name: createdAt, type: timestamp, purpose: Период отчёта и срок удаления}
    writers: сервер формы создаёт pending; защищённый экран меняет статус; сервисы меняют только свои состояния
  - id: legacy-requests
    source: studio/tables/legacyRequests.table.ts
    purpose: Сохранить действующий старый вход до сверки и возможность отката
    owner: прежний обработчик до согласованного переключения
    readers: [оператор миграции с правами администратора, прежний Staff+ экран]
    identity:
      key: legacyId
      rule: Миграция сопоставляет каждый старый ID одному requestId; дельта переносится идемпотентно
    fields:
      - {name: legacyId, type: string, purpose: Устойчивый ID старой заявки}
      - {name: classId, type: string, purpose: Занятие для сохранения и ручного решения после переноса}
      - {name: testRecipientKey, type: string, purpose: Ключ синтетического контакта для последующего CRM-события}
      - {name: status, type: pending | confirmed | declined, purpose: Исход заявки для сверки}
      - {name: createdAt, type: timestamp, purpose: Контроль дельты и срок хранения}
    migration: сохранить classId/testRecipientKey/status/createdAt; requestId детерминирован по legacyId; requestKey равен legacy:<legacyId>; оба eventState сначала not-applicable; pending получает noticePending=true и noticeState=manual-backlog без Store, completed получает false и not-applicable; при пустом занятии или неразрешённом ключе остановить cutover; затем пауза входа, дельта, сверка и переключение
retention:
  decided: true
  current: Только синтетические записи; удаление через 30 дней после создания с удалением ключей контактов после самой поздней заявки
identity: Контакты не хранятся в requests; qa-studio сопоставлен с config.variables.testRecipient_qa_studio.value, а соответствие сохраняется до удаления последней заявки с этим ключом

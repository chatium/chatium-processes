version: 1
title: Контрольная запись
businessModel: Вымышленная ручная запись на занятие
requiredRoles: [request, admin]
entityFields: [requestId, classId, status, noticePending, noticeState]
pages:
  - nodeId: request-page
    role: request
    route: /studio/request
    purpose: Принять синтетический запрос и показать нейтральный ответ
    filters: []
    access: GET и POST проверяют подписанное тестовое приглашение, срок и account на сервере
    form: [classId, requestKey]
    errors: [ошибка записи не показывает успех]
  - nodeId: admin-review
    role: admin
    route: /studio/admin
    purpose: Защищённый список pending заявок, ошибок Store и ручной очереди перенесённых заявок; решение по записи
    filters: [status, noticePending, noticeState]
    access: Staff+ с проверкой роли и доступа к заявке на сервере
    actions: [открыть заявку по requestId, отметить просмотр и noticeState=acknowledged, confirmed, declined, ограниченно повторить Store для новой заявки со skipped или error]

name: Test processes skill
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Test installed copy without development files
        run: |
          mkdir -p "$RUNNER_TEMP/processes-installed"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/processes-installed"
          rm -r "$RUNNER_TEMP/processes-installed/.github"
          rm "$RUNNER_TEMP/processes-installed/README.md"
          cd "$RUNNER_TEMP/processes-installed"
          npm ci --ignore-scripts
          npm test

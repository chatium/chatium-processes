name: Test processes skill
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gate verifies ancestry from the tested commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Test installed copy without development files
        run: |
          mkdir -p "$RUNNER_TEMP/skills-release/skills/chatium-development"
          git init -q -b main "$RUNNER_TEMP/skills-release"
          touch "$RUNNER_TEMP/skills-release/skills/chatium-development/SKILL.md"
          node .github/sync-skill.mjs release "$RUNNER_TEMP/skills-release"
          node .github/sync-skill.mjs release-status "$RUNNER_TEMP/skills-release"
          mkdir -p "$RUNNER_TEMP/skills-release/skills/chatium-processes/scripts/tests"
          cp -R scripts/tests/. "$RUNNER_TEMP/skills-release/skills/chatium-processes/scripts/tests/"
          cd "$RUNNER_TEMP/skills-release/skills/chatium-processes"
          npm ci --ignore-scripts
          node scripts/tests/run.mjs
